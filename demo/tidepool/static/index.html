<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tidepool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>tidepool</h1>
  <ul id="summary"></ul>
  <div id="charts"></div>
  <form id="log-form">
    <input name="tank" placeholder="tank name" required>
    <input name="temp" type="number" step="0.1" placeholder="°C" required>
    <input name="ph" type="number" step="0.1" placeholder="pH" required>
    <button>log reading</button>
  </form>
  <script type="module" src="app.js"></script>
</body>
</html>
